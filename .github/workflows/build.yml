name: Build RPM

on:
  push:
    branches: [main, initial-scaffold]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SFOS_RELEASE: 5.2.0.15

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hl, i486]
    steps:
      - uses: actions/checkout@v4

      - name: Build in Sailfish OS Platform SDK
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm \
            -v "$PWD":/src:ro -v "$PWD/out":/out \
            coderus/sailfishos-platform-sdk:${SFOS_RELEASE} \
            bash -lc '
              set -e
              cp -r /src ~/build && cd ~/build
              sdk-assistant list || true
              mb2 -t SailfishOS-'"${SFOS_RELEASE}"'-${{ matrix.arch }} build
              cp RPMS/*.rpm /out/
            '
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: out/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rpms
          merge-multiple: true
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_SHA::7}"
          gh release create "$TAG" rpms/*.rpm \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Test build ${GITHUB_SHA::7} (SFOS ${SFOS_RELEASE})" \
            --notes "Automatic test build from ${GITHUB_REF_NAME}. Demo login: user name demo."
